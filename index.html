<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSY 452 OOP Study App - Dark Mode</title>
    <style>
        :root {
            --bg-main: #121212;
            --bg-panel: #1e1e1e;
            --sidebar: #181818;
            --border: #333333;
            --primary: #93c5fd;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            
            --exam-bg: #292518;
            --exam-border: #d97706;
            --exam-text: #fbbf24;
            
            --correct-bg: #064e3b;
            --correct-border: #10b981;
            --correct-text: #a7f3d0;
            
            --wrong-bg: #7f1d1d;
            --wrong-border: #ef4444;
            --wrong-text: #fecaca;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg-main); color: var(--text-main); }
        
        aside { width: 280px; background: var(--sidebar); color: var(--text-main); padding: 20px; display: flex; flex-direction: column; border-right: 1px solid var(--border); flex-shrink: 0;}
        aside h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 1px solid var(--border); padding-bottom: 10px; color: var(--text-main); }
        
        .module-list { list-style: none; padding: 0; margin: 0; flex-grow: 1; overflow-y: auto; }
        .module-list li { padding: 12px; margin-bottom: 8px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; transition: 0.2s; font-weight: 500; color: var(--text-muted); }
        .module-list li:hover { border-color: var(--primary); color: var(--text-main); }
        .module-list li.active { background: var(--accent); color: white; border-color: var(--accent); }
        
        main { flex: 1; display: flex; flex-direction: column; padding: 40px; overflow-y: auto; }
        
        .top-action-bar { margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px; }
        #module-title { margin: 0; font-size: 2rem; color: var(--text-main); }
        
        #top-new-attempt-btn { background: #059669; font-size: 1.1rem; padding: 12px 24px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        #top-new-attempt-btn:hover { background: #047857; }

        /* Main View Tabs */
        .main-tabs { display: flex; gap: 10px; margin-bottom: 30px; border-bottom: 2px solid var(--border); padding-bottom: 15px; }
        .main-tab-btn { padding: 12px 24px; border: 1px solid var(--border); background: var(--bg-panel); color: var(--text-muted); border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 1rem; }
        .main-tab-btn:hover { background: var(--border); color: var(--text-main); }
        .main-tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        
        /* Sections Toggle */
        .view-section { display: none; }
        .view-section.active { display: block; }
        
        /* Note Styles */
        #notes-container { line-height: 1.45; font-size: 1.05rem; color: #f1f5f9; padding-bottom: 20px;}
        #notes-container h3 { border-bottom: 2px solid var(--border); padding-bottom: 12px; color: var(--primary); margin-top: 0; margin-bottom: 20px; font-size: 1.6rem; letter-spacing: 0.5px; }
        #notes-container h4 { color: var(--accent); margin-top: 35px; margin-bottom: 20px; font-size: 1.3rem; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        #notes-container p { margin-bottom: 1.2rem; }
        #notes-container ul, #notes-container ol { margin-bottom: 1.5rem; padding-left: 2rem; }
        #notes-container li { margin-bottom: 1rem; }
        #notes-container li > ul { margin-top: 1rem; margin-bottom: 0; padding-left: 2.8rem; list-style-type: circle; }
        #notes-container li > ul > li { margin-bottom: 0.8rem; }
        #notes-container strong { color: #ffffff; font-size: 1.05rem; letter-spacing: 0.2px; }
        #notes-container em { font-style: italic; color: #93c5fd; }
        
        .highlight-tag { color: #dbeafe; font-style: normal; background: rgba(59, 130, 246, 0.15); padding: 3px 10px; border-radius: 6px; font-weight: 500; margin: 0; display: inline-block; border: 1px solid rgba(59, 130, 246, 0.3); vertical-align: baseline; }
        .standard-notes { background: #161616; border: 1px solid var(--border); padding: 40px; margin: 30px 0; border-radius: 10px; }
        .exam-focus { background-color: var(--exam-bg); border: 1px solid rgba(217, 119, 6, 0.3); border-left: 8px solid var(--exam-border); padding: 40px; margin: 35px 0; border-radius: 0 10px 10px 0; }
        .exam-focus-label { display: block; font-weight: bold; color: var(--exam-text); margin-bottom: 20px; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; }

        /* Short Answers Tab Styles */
        .pills-container { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .pill-btn { padding: 8px 18px; border-radius: 20px; border: 1px solid var(--primary); background: transparent; color: var(--primary); font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.95rem; }
        .pill-btn:hover { background: rgba(147, 197, 253, 0.1); }
        .pill-btn.active { background: var(--primary); color: var(--bg-main); }

        .qa-card { background: var(--bg-panel); border: 1px solid var(--border); border-left: 4px solid var(--accent); padding: 25px; margin-bottom: 20px; border-radius: 8px; position: relative; }
        .qa-badge { position: absolute; top: 10px; right: 15px; font-size: 0.8rem; color: var(--accent); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .qa-q { font-size: 1.2rem; font-weight: bold; color: var(--text-main); margin-top: 0; margin-bottom: 15px; line-height: 1.4; padding-right: 80px; }
        .qa-a { font-size: 1.05rem; color: var(--text-muted); line-height: 1.5; margin: 0; }
        
        /* Separate Quiz Page Overlay */
        #quiz-page-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg-main); z-index: 1000; display: none; flex-direction: column; padding: 40px; box-sizing: border-box; overflow-y: auto; }
        #quiz-page-overlay.active { display: flex; }

        .quiz-container { max-width: 800px; width: 100%; margin: auto; background: var(--bg-panel); padding: 40px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 8px 16px rgba(0,0,0,0.5); }
        .quiz-header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 15px; margin-bottom: 30px; }
        .quiz-header-title { color: #10b981; margin: 0; font-size: 1.8rem; }
        
        .options { display: flex; flex-direction: column; gap: 16px; margin-top: 30px; }
        .option-btn { padding: 18px 24px; border: 2px solid var(--border); background: var(--bg-main); color: var(--text-main); border-radius: 10px; cursor: pointer; text-align: left; transition: 0.2s; font-size: 1.1rem; line-height: 1.45; }
        .option-btn:hover:not(:disabled) { background: #262626; transform: translateY(-2px); }
        .option-btn.correct { background: var(--correct-bg); border-color: var(--correct-border); color: var(--correct-text); font-weight: bold; }
        .option-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong-border); color: var(--wrong-text); }
        
        .explanation-box { margin-top: 25px; padding: 20px; border-radius: 8px; background: rgba(59, 130, 246, 0.1); border: 1px solid var(--accent); font-size: 1.05rem; line-height: 1.5; display: none; }
        .explanation-box.active { display: block; }

        .quiz-controls { display: flex; justify-content: space-between; margin-top: 35px; align-items: center; padding-top: 25px; border-top: 1px solid var(--border); }
        button.action-btn { background: var(--accent); color: white; border: none; padding: 14px 28px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1.05rem; transition: background 0.2s; }
        button.action-btn:hover:not(:disabled) { background: var(--accent-hover); }
        button.action-btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }
        #back-to-notes-btn { background: #dc2626; }
        #back-to-notes-btn:hover { background: #b91c1c; }
    </style>
</head>
<body>

    <aside>
        <h2>PSY 452 Modules</h2>
        <ul class="module-list" id="sidebar-list"></ul>
    </aside>

    <main id="main-view">
        <div class="top-action-bar">
            <h1 id="module-title">Select a Module</h1>
            <button id="top-new-attempt-btn">Start Practice Quiz</button>
        </div>

        <div class="main-tabs">
            <button class="main-tab-btn active" data-target="notes-container">Study Notes</button>
            <button class="main-tab-btn" data-target="short-answers-container">Test Review: Short Answers</button>
        </div>

        <section id="notes-container" class="view-section active"></section>

        <section id="short-answers-container" class="view-section">
            <div class="pills-container" id="sa-pills"></div>
            <div id="sa-content"></div>
        </section>
    </main>

    <div id="quiz-page-overlay">
        <div class="quiz-container">
            <div class="quiz-header-bar">
                <h2 class="quiz-header-title" id="quiz-page-title">Module Practice Quiz</h2>
                <button class="action-btn" id="back-to-notes-btn">Exit Quiz</button>
            </div>
            <h3 id="q-counter" style="color: var(--primary); font-size: 1.2rem;"></h3>
            <p id="q-text" style="font-size: 1.3rem; font-weight: 500; margin-top: 25px; line-height: 1.45;"></p>
            <div class="options" id="options-container"></div>
            
            <div id="explanation-container" class="explanation-box"></div>

            <div class="quiz-controls">
                <button class="action-btn" id="prev-btn">Previous</button>
                <span id="score-display" style="font-size: 1.3rem; font-weight: bold; color: var(--primary);">Score: 0 / 10</span>
                <button class="action-btn" id="next-btn">Next</button>
            </div>
        </div>
    </div>

    <!-- External Script References -->
    <script src="lecture1.js"></script>
    <script src="lecture2.js"></script>
    <script src="lecture3.js"></script>
    <script src="quizdata.js"></script>
    <script src="shortanswers.js"></script>
    
    <script>
        // Automatic Error Checker
        window.addEventListener('DOMContentLoaded', function() {
            let missingFiles = [];
            if (typeof lecture1Notes === 'undefined') missingFiles.push("lecture1.js");
            if (typeof lecture2Notes === 'undefined') missingFiles.push("lecture2.js");
            if (typeof lecture3Notes === 'undefined') missingFiles.push("lecture3.js");
            if (typeof lecture1Quiz === 'undefined') missingFiles.push("quizdata.js");
            if (typeof shortAnswersData === 'undefined') missingFiles.push("shortanswers.js");

            if (missingFiles.length > 0) {
                alert("ERROR: The app cannot load the following files: " + missingFiles.join(", ") + "\\n\\nPlease make sure they are saved in the exact same folder as index.html.");
                return; 
            }

            const database = new CourseDatabase();
            const app = new AppController(database);
        });

        class CourseDatabase {
            constructor() {
                this.modules = new Map();
                this.seedData();
            }
            seedData() {
                this.modules.set(1, { id: 1, title: "Lecture 1: Psychology of Prejudice", notes: lecture1Notes, quiz: lecture1Quiz });
                this.modules.set(2, { id: 2, title: "Lecture 2: Intergroup Discrimination", notes: lecture2Notes, quiz: lecture2Quiz });
                this.modules.set(3, { id: 3, title: "Lecture 3: Evolutionary Approaches", notes: lecture3Notes, quiz: lecture3Quiz });
            }
            getModule(id) { return this.modules.get(id); }
            getAllModules() { return Array.from(this.modules.values()); }
        }

        class QuizEngine {
            constructor(uiController) {
                this.ui = uiController;
                this.allQuestions = [];
                this.questions = [];
                this.currentQ = 0;
                this.score = 0;
                this.answered = [];
                this.moduleId = null;
            }

            loadPool(moduleId, quizData) {
                this.moduleId = moduleId;
                this.allQuestions = quizData;
            }

            startNewAttempt() {
                if (!this.allQuestions || this.allQuestions.length === 0) return;

                const poolSize = Math.min(this.allQuestions.length, 10);
                const usedKey = 'psy452_used_qs_' + this.moduleId;
                const usedString = sessionStorage.getItem(usedKey);
                let usedIndices = usedString ? JSON.parse(usedString) : [];
                
                let availableIndices = [];
                for (let i = 0; i < this.allQuestions.length; i++) {
                    if (usedIndices.indexOf(i) === -1) {
                        availableIndices.push(i);
                    }
                }

                if (availableIndices.length < poolSize) {
                    alert("Question pool exhausted for this session! Resetting available questions.");
                    usedIndices = [];
                    availableIndices = [];
                    for (let j = 0; j < this.allQuestions.length; j++) {
                        availableIndices.push(j);
                    }
                }

                for (let k = availableIndices.length - 1; k > 0; k--) {
                    const l = Math.floor(Math.random() * (k + 1));
                    const temp = availableIndices[k];
                    availableIndices[k] = availableIndices[l];
                    availableIndices[l] = temp;
                }

                const selectedIndices = availableIndices.slice(0, poolSize);
                usedIndices = usedIndices.concat(selectedIndices);
                sessionStorage.setItem(usedKey, JSON.stringify(usedIndices));

                const self = this;
                this.questions = selectedIndices.map(function(idx) {
                    return self.allQuestions[idx];
                });
                
                this.currentQ = 0;
                this.score = 0;
                this.answered = new Array(this.questions.length).fill(false);
                
                this.render();
            }

            checkAnswer(selectedIndex) {
                if (this.answered[this.currentQ]) return;
                
                this.answered[this.currentQ] = true;
                const qObj = this.questions[this.currentQ];
                const correctIndex = qObj.answer;
                
                if (selectedIndex === correctIndex) {
                    this.score++;
                }
                this.ui.updateQuizUI(this, selectedIndex, correctIndex, qObj.explanation);
            }

            navigate(direction) {
                this.currentQ += direction;
                this.render();
            }

            render() {
                if (this.questions.length > 0) {
                    this.ui.renderQuizState(this);
                }
            }
        }

        class AppController {
            constructor(db) {
                this.db = db;
                this.quizEngine = new QuizEngine(this);
                this.activeModuleId = null;
                this.cacheDOM();
                this.bindEvents();
                this.initSidebar();
                this.initShortAnswers();
            }

            cacheDOM() {
                this.sidebar = document.getElementById('sidebar-list');
                this.moduleTitle = document.getElementById('module-title');
                this.notesContainer = document.getElementById('notes-container');
                this.quizPageOverlay = document.getElementById('quiz-page-overlay');
                this.quizPageTitle = document.getElementById('quiz-page-title');
                
                this.qCounter = document.getElementById('q-counter');
                this.qText = document.getElementById('q-text');
                this.optionsContainer = document.getElementById('options-container');
                this.explanationContainer = document.getElementById('explanation-container');
                this.scoreDisplay = document.getElementById('score-display');
                this.prevBtn = document.getElementById('prev-btn');
                this.nextBtn = document.getElementById('next-btn');
                this.topNewAttemptBtn = document.getElementById('top-new-attempt-btn');
                this.backToNotesBtn = document.getElementById('back-to-notes-btn');
                
                this.mainTabs = document.querySelectorAll('.main-tab-btn');
                this.viewSections = document.querySelectorAll('.view-section');
            }

            bindEvents() {
                const self = this;
                this.prevBtn.addEventListener('click', function() { self.quizEngine.navigate(-1); });
                this.nextBtn.addEventListener('click', function() { self.quizEngine.navigate(1); });
                
                this.topNewAttemptBtn.addEventListener('click', function() {
                    const mod = self.db.getModule(self.activeModuleId);
                    self.quizPageTitle.innerText = mod.title + " - Practice Quiz";
                    self.quizPageOverlay.classList.add('active');
                    self.quizEngine.startNewAttempt();
                });

                this.backToNotesBtn.addEventListener('click', function() {
                    self.quizPageOverlay.classList.remove('active');
                });

                this.mainTabs.forEach(tab => {
                    tab.addEventListener('click', (e) => {
                        self.mainTabs.forEach(t => t.classList.remove('active'));
                        self.viewSections.forEach(s => s.classList.remove('active'));
                        
                        e.target.classList.add('active');
                        document.getElementById(e.target.getAttribute('data-target')).classList.add('active');
                    });
                });
            }

            initShortAnswers() {
                if (typeof shortAnswersData === 'undefined') return;
                
                const pillsContainer = document.getElementById('sa-pills');
                pillsContainer.innerHTML = '';
                
                const allPill = document.createElement('button');
                allPill.className = 'pill-btn active';
                allPill.innerText = 'All Lectures';
                allPill.addEventListener('click', () => {
                    document.querySelectorAll('.pill-btn').forEach(p => p.classList.remove('active'));
                    allPill.classList.add('active');
                    this.renderSAContent('all');
                });
                pillsContainer.appendChild(allPill);

                Object.keys(shortAnswersData).forEach(lecNum => {
                    const pill = document.createElement('button');
                    pill.className = 'pill-btn';
                    pill.innerText = `Lecture ${lecNum}`;
                    pill.addEventListener('click', () => {
                        document.querySelectorAll('.pill-btn').forEach(p => p.classList.remove('active'));
                        pill.classList.add('active');
                        this.renderSAContent(lecNum);
                    });
                    pillsContainer.appendChild(pill);
                });

                this.renderSAContent('all');
            }

            renderSAContent(filter) {
                const container = document.getElementById('sa-content');
                container.innerHTML = '';

                Object.entries(shortAnswersData).forEach(([lecNum, qaList]) => {
                    if (filter !== 'all' && filter !== lecNum) return;

                    qaList.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'qa-card';
                        card.innerHTML = `
                            <div class="qa-badge">Lecture ${lecNum}</div>
                            <h3 class="qa-q">Q: ${item.q}</h3>
                            <p class="qa-a"><strong>A:</strong> ${item.a}</p>
                        `;
                        container.appendChild(card);
                    });
                });
            }

            initSidebar() {
                const modules = this.db.getAllModules();
                const self = this;
                modules.forEach(function(mod) {
                    const li = document.createElement('li');
                    li.innerText = mod.title;
                    li.setAttribute('data-id', mod.id);
                    li.addEventListener('click', function() {
                        self.loadModule(mod.id);
                        document.getElementById('main-view').scrollTop = 0;
                    });
                    self.sidebar.appendChild(li);
                });
                if (modules.length > 0) {
                    this.loadModule(modules[0].id);
                }
            }

            loadModule(id) {
                this.activeModuleId = id;
                const mod = this.db.getModule(id);
                
                const listItems = document.querySelectorAll('.module-list li');
                listItems.forEach(function(li) { li.classList.remove('active'); });
                
                const activeLi = document.querySelector('.module-list li[data-id="' + id + '"]');
                if (activeLi) activeLi.classList.add('active');
                
                this.mainTabs.forEach(t => t.classList.remove('active'));
                this.viewSections.forEach(s => s.classList.remove('active'));
                document.querySelector('.main-tab-btn[data-target="notes-container"]').classList.add('active');
                document.getElementById('notes-container').classList.add('active');

                this.moduleTitle.innerText = mod.title;
                this.renderNotes(mod.notes);
                this.quizEngine.loadPool(mod.id, mod.quiz);
            }

            renderNotes(notesData) {
                this.notesContainer.innerHTML = '';
                const self = this;
                
                notesData.forEach(function(note) {
                    const div = document.createElement('div');
                    div.className = note.type;
                    
                    if (note.type === 'exam-focus') {
                        const label = document.createElement('span');
                        label.className = 'exam-focus-label';
                        label.innerText = '⭐ EXAM FOCUS';
                        div.appendChild(label);
                    }
                    
                    const contentDiv = document.createElement('div');
                    contentDiv.innerHTML = note.content;
                    div.appendChild(contentDiv);
                    
                    self.notesContainer.appendChild(div);
                });
            }

            renderQuizState(engine) {
                const qData = engine.questions[engine.currentQ];
                const currentNum = engine.currentQ + 1;
                const totalNum = engine.questions.length;
                
                this.qCounter.innerText = 'Question ' + currentNum + ' of ' + totalNum;
                this.qText.innerText = qData.q;
                this.scoreDisplay.innerText = 'Score: ' + engine.score + ' / ' + totalNum;
                
                this.optionsContainer.innerHTML = '';
                this.explanationContainer.innerHTML = '';
                this.explanationContainer.classList.remove('active');

                const self = this;
                qData.options.forEach(function(opt, index) {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt;
                    if (engine.answered[engine.currentQ]) {
                        btn.disabled = true;
                    }
                    btn.addEventListener('click', function() {
                        engine.checkAnswer(index);
                    });
                    self.optionsContainer.appendChild(btn);
                });

                this.prevBtn.disabled = engine.currentQ === 0;
                this.nextBtn.disabled = engine.currentQ === (totalNum - 1);
            }

            updateQuizUI(engine, selectedIndex, correctIndex, explanationText) {
                const buttons = this.optionsContainer.querySelectorAll('.option-btn');
                buttons.forEach(function(b) {
                    b.disabled = true;
                });
                
                if (selectedIndex === correctIndex) {
                    buttons[selectedIndex].classList.add('correct');
                } else {
                    buttons[selectedIndex].classList.add('wrong');
                    buttons[correctIndex].classList.add('correct');
                }
                
                this.explanationContainer.innerHTML = "<strong>Explanation:</strong> " + explanationText;
                this.explanationContainer.classList.add('active');

                const totalNum = engine.questions.length;
                this.scoreDisplay.innerText = 'Score: ' + engine.score + ' / ' + totalNum;
            }
        }
    </script>
</body>
</html>
